; Standard ESP32 for testing (no display)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter = +<main.cpp> +<bluetooth_helper.h> +<Code39Generator.h> +<permit_config.h> +<imgs/*> +<Fonts/*>

lib_deps =
  bblanchon/ArduinoJson@^7.0.0

lib_ldf_mode = chain
monitor_filters = colorize

; Heltec Vision Master E290 (production)
[env:vision_e290]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_src_filter = +<main.cpp> +<*> -<sleep_test.cpp>

; Enable native USB CDC for S3 so Serial works reliably
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_HW_CDC_ON_BOOT=1
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -I $PROJECT_DIR/src/Fonts
  -DHELTEC_BOARD=37
  -DE290
  -DVision_Master_E290
  -DHT_VME290

lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  bblanchon/ArduinoJson@^7.0.0

lib_ldf_mode = chain

monitor_filters = colorize

; Deep-sleep current test (throwaway). Flash: pio run -e sleep_test -t upload
; Compiles ONLY sleep_test.cpp, not main.cpp -- see NOTES.md "Testing the sleep current".
[env:sleep_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_src_filter = -<*> +<sleep_test.cpp>

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_HW_CDC_ON_BOOT=1
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -I $PROJECT_DIR/src/Fonts
  -DHELTEC_BOARD=37
  -DE290
  -DVision_Master_E290
  -DHT_VME290

lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  bblanchon/ArduinoJson@^7.0.0

lib_ldf_mode = chain
monitor_filters = colorize

; Dev build: same firmware, but never deep sleeps, so USB serial and flashing keep working
; without the BOOT button. Button and scheduled check-ins still run. Don't leave it on battery.
; Flash: pio run -e dev -t upload
[env:dev]
extends = env:vision_e290
build_flags =
  ${env:vision_e290.build_flags}
  -DDEV_NO_SLEEP

; Low-battery UI test: dev build (no sleep) reporting a fake 3.45V, so the display draws the
; low-battery icon and the app shows ~5% + the "Charge the display" notification.
; Flash: pio run -e fake_low_battery -t upload   (then re-flash vision_e290 afterwards)
[env:fake_low_battery]
extends = env:vision_e290
build_flags =
  ${env:vision_e290.build_flags}
  -DDEV_NO_SLEEP
  -DFAKE_BATTERY_MV=3450

; Small charging icon instead of the full-screen charging view: the permit stays on screen while
; charging, with a bolt and the % at the top right. For charging in the car.
; Flash: pio run -e charge_icon -t upload
[env:charge_icon]
extends = env:vision_e290
build_flags =
  ${env:vision_e290.build_flags}
  -DCHARGE_FULL_SCREEN=0

; Demo of the charging view: dev build (no sleep) that acts as if plugged in, full-screen view on.
; Flash: pio run -e charge_demo -t upload   (then flash vision_e290 again)
[env:charge_demo]
extends = env:dev
build_flags =
  ${env:dev.build_flags}
  -DCHARGE_FULL_SCREEN=1
  -DFORCE_CHARGING

